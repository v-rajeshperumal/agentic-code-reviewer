[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "specguard"
version = "0.1.0"
description = "Agentic PR & Architectural Spec-Compliance Reviewer built with Strands Agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "strands-agents>=1.0.0",
    "opentelemetry-api>=1.30.0",
    "pydantic>=2.7.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "tenacity>=8.2.3",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
]

[project.optional-dependencies]
ollama = ["strands-agents[ollama]>=1.0.0"]
gemini = ["strands-agents[gemini]>=1.0.0"]
trace = ["strands-agents[otel]>=1.0.0"]
dev = [
    "pytest>=8.0.0",
    "nbformat>=5.10.0",
]

[project.scripts]
specguard = "specguard.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `evals/` lives at the repo root, outside the installed package.
pythonpath = ["."]
